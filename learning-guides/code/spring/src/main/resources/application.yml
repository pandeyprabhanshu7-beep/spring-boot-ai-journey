server:
  address: 127.0.0.1
  port: 8080
  shutdown: graceful
spring:
  application:
    name: atlas-training
  lifecycle:
    timeout-per-shutdown-phase: 20s
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${CHAT_MODEL}
        temperature: 0.0
        num-predict: 400
      embedding:
        model: ${EMBED_MODEL}
        truncate: false
    mcp:
      server:
        name: atlas-training-tools
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
